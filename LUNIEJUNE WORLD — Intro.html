<title>LUNIEJUNE WORLD — Intro</title>

<style>
:root{--ink:#7a5fb0;--card:rgba(255,255,255,.78);--bd:rgba(205,184,255,.7);--bg:#bfe0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--ink:#f1e8ff;--card:rgba(58,46,92,.66);--bd:rgba(205,184,255,.35);--bg:#8fb4e6}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Fredoka,"Trebuchet MS",sans-serif;color:var(--ink)}
canvas{display:block;touch-action:none}
.card{position:fixed;background:var(--card);border:2px solid var(--bd);border-radius:22px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none}
#logo{top:calc(14px + env(safe-area-inset-top,0px));left:14px;padding:8px 16px}

#hint{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:8px 18px;font-size:13px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#load,#fb{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#bfe0ff,#ffe3f0);z-index:9;transition:opacity .8s;text-align:center;padding:20px}

:root{--pw:300px;--ph:400px}

.cl::before{width:50px;height:50px;left:16px;top:-24px}.cl::after{width:36px;height:36px;right:18px;top:-16px}

.leaf,.base,.rboard{position:absolute;left:50%;top:0;width:50%;height:100%}
.in,.base{top:1.4%;height:97.2%;width:48.6%}

.base::after{content:"";position:absolute;inset:0;border-radius:2px 5px 5px 2px;box-shadow:1px 1px 0 #efe3c8,2px 2px 0 #e4d5b4,3px 3px 0 #efe3c8,4px 4px 0 #e0d0ae;z-index:-1}

.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2px 5px 5px 2px;background:radial-gradient(ellipse at 30% 15%,#fffdf6,transparent 70%),repeating-linear-gradient(0deg,rgba(150,120,70,.04) 0 1px,transparent 1px 3px),linear-gradient(#faf0d9,#f2e3c3)}

.cover .face{border-radius:3px 12px 12px 3px;background:#f4adc1}
.cover .back{border-radius:12px 3px 3px 12px}
.spine{position:absolute;left:46%;width:8%;top:0;height:100%;background:linear-gradient(90deg,transparent,rgba(90,50,70,.28),transparent);transform:translateZ(2px);pointer-events:none;opacity:0;transition:opacity .8s .5s}
#book.open .spine{opacity:1}
.strap,.clasp,.lock{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.strap{left:90%;top:44%;width:28%;height:12%;background:linear-gradient(#f9c3d2,#ef9fb6);border-radius:0 8px 8px 0;box-shadow:0 2px 6px rgba(90,40,70,.3);transform:translateZ(2px);transform-origin:0 50%}
.strap::after{content:"";position:absolute;inset:18% 6%;border:1px dashed rgba(255,255,255,.8);border-radius:4px}
.clasp{left:86%;top:41%;width:6%;height:18%;background:linear-gradient(90deg,#fff2a8,#e8bf4a,#c99422);border-radius:2px;transform:translateZ(3px)}
.lock{left:79%;top:44%;width:17%;transform:translateZ(4px);transform-origin:50% 0}
.lock svg{width:100%;display:block;filter:drop-shadow(0 3px 3px rgba(90,40,70,.35))}
.cover.un .lock{animation:fall 1.1s cubic-bezier(.5,0,1,.6) forwards}
@keyframes fall{0%{transform:translateZ(4px) rotate(0)}15%{transform:translateZ(4px) translateY(-4%) rotate(-14deg)}100%{transform:translateZ(4px) translateY(260%) rotate(40deg);opacity:0}}

.endp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background-color:#f7bccb;background-image:radial-gradient(circle at 25% 25%,#ffe2ea 0 3px,transparent 4px),radial-gradient(circle at 75% 75%,#ffe9a8 0 2.5px,transparent 3.5px);background-size:38px 38px}
.plate{background:#fffaf0;border:2px double #d9a441;padding:1em 1.4em;text-align:center;font-size:calc(var(--pw)/20);line-height:1.6;color:#9b4f7a;border-radius:4px}
.plate b{display:block;font-style:italic;font-weight:400;font-size:1.25em}.plate span{letter-spacing:.2em;font-size:.7em}
.pg{position:absolute;inset:0;padding:9% 10% 8%;box-sizing:border-box;display:flex;flex-direction:column;gap:.55em;font-size:calc(var(--pw)/17);line-height:1.5}
.tx{justify-content:center}
.ch{font-size:.7em;letter-spacing:.3em;text-transform:uppercase;text-align:center;color:#c58a3a}

.d{margin:0;font-size:.92em;text-align:justify}

.dv{width:60%;align-self:center}
.pn{position:absolute;bottom:4%;left:0;right:0;text-align:center;font-size:.72em;font-style:italic;color:#a8896a}
.art{flex:1;min-height:0;border:3px double #d9a441;border-radius:4px;padding:.3em;background:#fffaf0;display:flex}
.sky{flex:1;position:relative;overflow:hidden;border-radius:2px;background:linear-gradient(#b9e0ff,#e8f5ff 62%,#c9efc3 62%)}
.sky svg{position:absolute;left:3%;bottom:2%;width:94%;height:94%}
.cap{text-align:center;font-style:italic;font-size:.78em;color:#8b6a7a}
#hint{position:absolute;bottom:calc(7vh + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:italic 600 18px Georgia,serif;color:#fff;text-shadow:0 2px 8px rgba(110,70,160,.7);animation:hp 2.2s ease-in-out infinite;transition:opacity .5s}
@keyframes hp{50%{opacity:.45}}
#glow{position:absolute;left:50%;top:50%;width:60vmin;height:60vmin;margin:-30vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,244,190,.95),rgba(255,214,120,.45) 40%,rgba(255,255,255,0) 70%);opacity:0;transform:scale(.4);transition:opacity 2s,transform 3.5s}
#glow.on{opacity:1;transform:scale(1.6)}
#warp{position:absolute;left:50%;top:50%;width:30vmin;height:30vmin;margin:-15vmin;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff8d0 35%,rgba(255,230,160,0) 70%);transform:scale(0);opacity:0;pointer-events:none}

#flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:60;pointer-events:none}
#flash.on{opacity:1}#flash.off{transition:opacity 1.4s}
@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important}}

#intro{background:linear-gradient(#4b3b8f 0%,#8a68c4 30%,#e59bc8 62%,#ffc9b2 86%,#ffe6bd 100%)}
.cl{--c:rgba(255,224,244,.55)}.cl,.cl::before,.cl::after{background:var(--c)}
#moon{position:absolute;top:7vh;right:11vw;width:10vmin;height:10vmin;border-radius:50%;box-shadow:inset -2.4vmin 0 0 0 #fff4cc,0 0 34px 6px rgba(255,244,204,.35);transform:rotate(-20deg)}
.sk{position:absolute;border-radius:50%;background:#fff;animation:twk 3s ease-in-out infinite}

@keyframes twk{50%{opacity:.25;transform:scale(.6)}}

.h-b{left:-10vw;bottom:14vh;width:70vw;height:34vh;background:linear-gradient(#a384cf,#7d62b0)}
.h-m{right:-18vw;bottom:-6vh;width:90vw;height:38vh;background:linear-gradient(#c0a2de,#9a7fc5)}

#castle{position:absolute;left:14vw;bottom:44vh;width:34vmin;opacity:.92}
.wn{animation:twk 3.5s ease-in-out infinite}

#hint{font:500 14px "Sarabun","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;letter-spacing:.08em;bottom:calc(4vh + env(safe-area-inset-bottom,0px))}
